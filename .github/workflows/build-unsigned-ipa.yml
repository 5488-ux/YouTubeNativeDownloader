name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iPhone app
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Resolve Swift packages
        run: |
          set -euxo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/YouTubeNativeDownloader.xcodeproj" \
            -scheme "YouTubeNativeDownloader"

      - name: Build unsigned iPhone app
        run: |
          set -euxo pipefail
          xcodebuild clean build \
            -project "$GITHUB_WORKSPACE/YouTubeNativeDownloader.xcodeproj" \
            -scheme "YouTubeNativeDownloader" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/YouTubeNativeDownloader.app"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build/ipa"

          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload" "$OUTPUT_DIR"
          mkdir -p "$RUNNER_TEMP/Payload" "$OUTPUT_DIR"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$OUTPUT_DIR/YouTubeNativeDownloader-5.3-unsigned.ipa" Payload
          test -s "$OUTPUT_DIR/YouTubeNativeDownloader-5.3-unsigned.ipa"
          shasum -a 256 "$OUTPUT_DIR/YouTubeNativeDownloader-5.3-unsigned.ipa" \
            | tee "$OUTPUT_DIR/YouTubeNativeDownloader-5.3-unsigned.ipa.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeNativeDownloader-5.3-unsigned
          path: |
            build/ipa/YouTubeNativeDownloader-5.3-unsigned.ipa
            build/ipa/YouTubeNativeDownloader-5.3-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
